<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Compra</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dcedc8, #81c784);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            background-color: white;

            width: 400px;
            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2e7d32;
        }

        button {
            width: 100%;

            margin-top: 25px;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background-color: #2e7d32;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: #1b5e20;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Finalizar Compra</h1>

        <p class="descricao">
            Preencha os dados abaixo
        </p>

        <form action="processa.php" method="POST">

            <label for="txtNome">
                Nome do cliente:
            </label>

            <input
                type="text"
                id="txtNome"
                name="txtNome"
                placeholder="Digite seu nome"
                required
            >


            <label for="txtValorCompra">
                Valor da compra:
            </label>

            <input
                type="number"
                id="txtValorCompra"
                name="txtValorCompra"
                placeholder="Ex: 150.00"
                step="0.01"
                min="0"
                required
            >


            <label for="cmbPag">
                Forma de pagamento:
            </label>

            <select
                id="cmbPag"
                name="cmbPag"
                required
            >

                <option value="">
                    Selecione uma opção
                </option>

                <option value="deposito">
                    Depósito
                </option>

                <option value="boleto">
                    Boleto
                </option>

                <option value="cartaoCredito">
                    Cartão de crédito
                </option>

            </select>


            <button type="submit">
                Finalizar Compra
            </button>

        </form>

    </div>

</body>
